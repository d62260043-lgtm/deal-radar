<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212">
<title>ROCKET</title>
<style>
  body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100dvh; }
  #header { background-color: #1f1f1f; padding: 15px; text-align: center; font-weight: bold; color: #00ff00; font-size: 18px; }
  #tabs { display: flex; background-color: #1a1a1a; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; cursor: pointer; color: #888; }
  .tab.active { color: #00ff00; border-bottom: 2px solid #00ff00; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 15px; white-space: pre-wrap; }
  .user-msg { background-color: #0056b3; color: white; align-self: flex-end; }
  .ai-msg { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; }
  #input-area { background-color: #1f1f1f; padding: 10px; display: flex; gap: 10px; padding-bottom: env(safe-area-inset-bottom); }
  #user-input { flex: 1; background-color: #2a2a2a; border: none; border-radius: 20px; padding: 12px; color: white; outline: none; font-size: 16px; }
  #send-btn { background-color: #00ff00; color: black; border: none; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; font-size: 18px; }
</style>
</head>
<body>
<div id="header">ROCKET</div>
<div id="tabs">
  <div class="tab active" onclick="setTab('video', this)">🎬 Видео</div>
  <div class="tab" onclick="setTab('code', this)">💻 Код</div>
  <div class="tab" onclick="setTab('analytics', this)">📈 Аналитика</div>
</div>
<div id="chat"></div>
<div id="input-area">
  <input type="text" id="user-input" placeholder="Напиши задачу...">
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>
<script>
  // Я ЗАМЕНИЛ AltRouter на прямой OpenRouter (с твоим старым ключом, который ты скидывал)
  // Если он не сработает, значит ключ забанен. Но OpenRouter реже блокирует запросы.
  const API_KEY = "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"; 
  const API_URL = "https://openrouter.ai/api/v1/chat/completions";
  const MODEL = "google/gemini-2.0-flash-exp:free"; 
  
  let currentTab = 'video';
  let history = [{ role: "system", content: "Ты — ROCKET, ИИ-продюсер Telegram-канала 'Радар Скидок'. Ты пишешь код для GitHub, придумываешь хуки, описания и анализируешь результаты. Отвечай кратко, по делу. Код пиши в блоках ```." }];
  const chatDiv = document.getElementById('chat');

  function setTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}-msg`;
    msgDiv.textContent = text;
    chatDiv.appendChild(msgDiv);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage(text, 'user');
    history.push({ role: "user", content: `[Режим: ${currentTab}] ` + text });
    
    const typing = document.createElement('div');
    typing.className = 'message ai-msg';
    typing.textContent = 'Думаю...';
    chatDiv.appendChild(typing);
    chatDiv.scrollTop = chatDiv.scrollHeight;

    fetch(API_URL, {
      method: 'POST',
      headers: { 
        'Authorization': `Bearer ${API_KEY}`, 
        'Content-Type': 'application/json',
        'HTTP-Referer': 'https://github.com/d62260043-lgtm/deal-radar', // Требование OpenRouter
        'X-Title': 'ROCKET App' 
      },
      body: JSON.stringify({ model: MODEL, messages: history, temperature: 0.7, max_tokens: 2048 })
    })
    .then(res => res.json())
    .then(data => {
      chatDiv.removeChild(typing);
      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        addMessage(reply, 'ai');
        history.push({ role: "assistant", content: reply });
      } else {
        addMessage("Ошибка API: " + JSON.stringify(data), 'ai');
      }
    })
    .catch(err => {
      chatDiv.removeChild(typing);
      addMessage("Ошибка сети: " + err, 'ai');
    });
  }
</script>
</body>
</html>
