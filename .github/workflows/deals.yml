name: deal-radar

on:
  schedule:
    - cron: '0 7 * * *'    # 10:00 МСК — утренний дайджест
    - cron: '0 9 * * *'    # 12:00 МСК — кейс дня
    - cron: '0 12 * * *'   # 15:00 МСК — горячая находка
    - cron: '0 15 * * *'   # 18:00 МСК — статистика владельцу
    - cron: '0 18 * * *'   # 21:00 МСК — вечерняя подборка
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning | noon | evening | case (раз в 2 дня) | case-force | stats | build'
        required: true
        default: 'case'
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          CASE_URL: https://d62260043-lgtm.github.io/deal-radar/
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$MODE" ] && [ "$MODE" = "build" ]; then
            node tools/cases.js --no-post
          elif [ -n "$MODE" ] || [ -n "$SCHED" ]; then
            node tools/run.js
          else
            echo "push без режима: только деплой сайта"
          fi
      - name: Save state
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state docs || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "no state changes"
          fi

  deploy:
    needs: post
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
