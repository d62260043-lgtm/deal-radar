name: deal-radar-video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg (static build)
        timeout-minutes: 6
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp "$(find /tmp/ff -name ffmpeg -type f | head -1)" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -c drawtext || echo "drawtext НЕТ"
      - name: Build and send video
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: node tools/make_video.js
      - name: Save video
        if: always()
        run: cp /tmp/vid/deals.mp4 ./deals.mp4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-video
          path: deals.mp4
          if-no-files-found: ignore
