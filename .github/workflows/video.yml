name: deal-radar-video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Build and send video
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: node tools/make_video.js
      - name: Save video
        if: always()
        run: cp /tmp/vid/deals.mp4 ./deals.mp4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-video
          path: deals.mp4
          if-no-files-found: ignore
